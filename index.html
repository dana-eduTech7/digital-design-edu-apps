<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل التصميم الرقمي للتطبيقات التعليمية المدعومة بالذكاء الاصطناعي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:linear-gradient(160deg,#efe9fd 0%,#ffffff 35%,#e1f5fa 68%,#f1e8ff 100%);--card2:#e4f5fa;--bg:#fff;--tx:#003944;--h1:#382972;--h2:#7030A0;--card:#f3f0fa;--bd:#d9d0ef;--ac:#208CAA;--ac2:#9338FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#003944;--tx:#e8f6f9;--h1:#d9ccff;--h2:#0DCFDA;--card:#0b4a57;--card2:#1b3a75;--g:linear-gradient(160deg,#003944 0%,#0a3358 48%,#2b2062 100%);--bd:#1673A4}}
:root[data-theme="dark"]{--card2:#1b3a75;--g:linear-gradient(160deg,#003944 0%,#0a3358 48%,#2b2062 100%);--bg:#003944;--tx:#e8f6f9;--h1:#d9ccff;--h2:#0DCFDA;--card:#0b4a57;--bd:#1673A4}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:var(--g);background-attachment:fixed;color:var(--tx);min-height:100vh;font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.9;font-size:1.05rem;transition:background .3s}
.wrap{margin:auto;padding:16px;max-width:1200px;transition:max-width .3s}
.wrap.mobile{max-width:420px}.wrap.tablet{max-width:780px}.wrap.laptop{max-width:1050px}.wrap.desktop{max-width:1200px}
h1{color:var(--h1);font-size:clamp(1.6rem,4.5vw,2.6rem);line-height:1.5;margin:.3em 0}
h2{color:var(--h2);font-size:1.4rem;margin:1.2em 0 .4em}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:3px solid;border-image:linear-gradient(90deg,#382972,#7030A0,#208CAA,#0DCFDA) 1}
.bar img{height:48px}.bar .t{font-weight:700;color:var(--h1);font-size:.9rem;flex:1}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 20px;background:linear-gradient(135deg,#382972,#7030A0);color:#fff;font-weight:500;transition:transform .15s}
button:hover{transform:translateY(-2px)}button.sec{background:transparent;color:var(--h2);border:2px solid var(--h2)}
button.ic{padding:6px 12px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;border-top:5px solid var(--ac);transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px #38297233}.card.s{cursor:default}.card.s:hover{transform:none;box-shadow:none}
.card b{color:var(--h2);display:block}.card small{opacity:.85}
.hero{text-align:center;padding:20px 0}.hero img{width:170px;max-width:50%}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.opts button{background:var(--card);color:var(--tx);border:2px solid var(--bd)}.opts button.on{background:var(--h2);color:#fff;border-color:var(--h2)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:28px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0}.tabs button{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:6px 14px;font-size:.85rem}.tabs button.on{background:var(--h2);color:#fff}
.q{border-right:5px solid var(--ac2);background:var(--card);padding:8px 14px;border-radius:10px;margin:8px 0}
.out{background:linear-gradient(135deg,#382972,#208CAA);color:#fff;border-radius:14px;padding:14px 18px;margin-top:16px}
.prog{height:6px;background:var(--bd);border-radius:6px;margin:8px 0}.prog i{display:block;height:100%;background:linear-gradient(90deg,#9338FF,#0DCFDA);border-radius:6px}
ul{padding-inline-start:22px}li{margin:4px 0}
textarea,input[type=text]{width:100%;font:inherit;border:1px solid var(--bd);border-radius:10px;padding:8px;background:var(--bg);color:var(--tx);min-height:46px}
label{font-weight:500;color:var(--h2);display:block;margin-top:10px}
.stars{font-size:2.2rem;direction:ltr;text-align:center}.stars span{cursor:pointer;color:#bbb}.stars span.on{color:#f5b301}
#mus{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);padding:6px 10px;border-radius:30px;z-index:9;align-items:center}
#mus input{width:70px;direction:ltr}
#vm{position:fixed;inset:0;background:#000000cc;z-index:30;display:none;align-items:center;justify-content:center;padding:16px}#vm.on{display:flex}#vm .bx{background:var(--bg);border:2px solid var(--h2);border-radius:18px;width:min(900px,100%);padding:14px}#vm .hd{display:flex;justify-content:space-between;align-items:center;color:var(--h1);font-weight:700;margin-bottom:10px}#vm .fr{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}#vm iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card{background:linear-gradient(145deg,var(--card),var(--card2))}
.grid>.card:nth-child(6n+1){border-top-color:#208CAA}.grid>.card:nth-child(6n+2){border-top-color:#7030A0}.grid>.card:nth-child(6n+3){border-top-color:#0DCFDA}.grid>.card:nth-child(6n+4){border-top-color:#9338FF}.grid>.card:nth-child(6n+5){border-top-color:#1673A4}.grid>.card:nth-child(6n){border-top-color:#757BBB}
.hero{background:linear-gradient(135deg,#382972 0%,#7030A0 50%,#208CAA 100%);border-radius:26px;padding:28px 18px;margin-top:14px;box-shadow:0 10px 30px #38297240}
.hero h1,.hero h2,.hero p{color:#fff}.hero button.sec{color:#fff;border-color:#fff}.hero .opts button{color:#003944;background:#ffffffe6;border-color:#ffffff}
.opts button.on,.tabs button.on{background:#7030A0;border-color:#9338FF;color:#fff}.hero .opts button.on{background:#0DCFDA;color:#003944;border-color:#fff}
.bar{background:var(--card);border-radius:0 0 16px 16px;padding:8px 14px}
.ck{display:flex;gap:10px;align-items:flex-start;color:var(--tx);font-weight:400;margin:4px 0;cursor:pointer}.ck input{margin-top:10px;width:18px;height:18px;accent-color:#7030A0}
.ico{display:inline-flex;vertical-align:-.22em;margin-inline-end:.3em}.ico svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.card .ico,h1 .ico{color:var(--h2)}.card>div .ico{margin:0}.card>div .ico svg{width:1.4em;height:1.4em}h1 .ico svg{width:1em;height:1em}
.fade{animation:f .4s}@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

{id:'cred',g:'ختام',i:'🏛️',t:'المراجع والمصادر',h:()=>`<p>هذا الدليل اجتهاد مهني من إعداد ذكائيات (ندى قطان)، يسترشد بالإطار الوطني الوارد أدناه في التعليم الإلكتروني مع إعادة صياغة الأفكار بأسلوب خاص، ولا يمثل مرجعًا رسميًا ولا يُنسب إلى الجهات المصدِرة لها، ويُقدَّم ليكون مرجعًا عمليًا للممارسين التعليميين.</p><p><b>المرجع المسترشَد به:</b><br>الإطار الصادر عن المركز الوطني للتعليم الإلكتروني لتصميم التعليم والتعلم المدعوم بالذكاء الاصطناعي.<br>وللتحقق من المحتوى الرسمي يُرجع إلى الإطار مباشرة.</p><div class="row"><a class="btn" href="https://drive.google.com/file/d/12B5rSdwUPWCRs_qeorc3UIhiSJteUjX5/view?usp=sharing" target="_blank" rel="noopener" style="text-decoration:none">📄 الاطلاع على الإطار الرسمي</a><button class="sec" onclick="vid()">🎬 فيديو ملخص</button></div>`},
{id:'rate',g:'ختام',i:'⭐',t:'تقييم المحتوى',h:()=>{const r=+S('rate')||0,u=S('use')||'';return`<p>رأيك يهمنا. قيّم هذا الدليل:</p><div class="stars">${[1,2,3,4,5].map(n=>`<span class="${n<=r?'on':''}" onclick="S('rate',${n});go('rate')">★</span>`).join('')}</div><h2>هل استفدت من المحتوى؟</h2><div class="opts">${['استفدت من المحتوى وسأطبقه','استفدت جزئيًا','أحتاج إلى مزيد من الأمثلة'].map(x=>`<button class="${u==x?'on':''}" onclick="S('use',this.textContent);go('rate')">${x}</button>`).join('')}</div><label>ملاحظاتك</label><textarea oninput="S('note',this.value)">${S('note')||''}</textarea>${r&&u?`<div class="out" style="text-align:center">🎉 شكرًا لك! نتمنى لك تطبيقًا موفقًا لما تعلمته.</div>`:''}`}}
];
